<!DOCTYPE html>
<html lang="en">

<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Form</title>
</head>

<body>
                    <h1>Registration Form</h1>
                    <form action="Post">
                                        <div>
                                                            <label for="username">Username:</label>
                                                            <input type="text" id="username" name="username"
                                                                                placeholder="Enter your name">
                                                            <br>
                                                            <br>
                                                            Gender:
                                                            <label for="male">Male</label>
                                                            <input type="radio" id="male" name="gender" value="male">
                                                            <label for="female">Female</label>
                                                            <input type="radio" id="female" name="gender"
                                                                                value="female">
                                                            <br><br>
                                                            <label for="number">Mobile:</label>
                                                            <input type="telephone" id="number" name="mobile"
                                                                                placeholder="Enter your mobile number">
                                        </div>
                                        <div>
                                                            <br>
                                                            <label for="mail">Email : </label>
                                                            <input type="text" id="mail" name="Email" placeholder="Enter email address">
                                                            <br>
                                                            <br>
                                                            <label for="comment">Enter your comment:</label><br>
                                                            <textarea id="comment" name="comment" placeholder="Enter your comment here"></textarea>
                                                            <br>
                                                            <br>
                                                            <select name="country" id="country">
                                                                                <option value="COUNTRY">COUNTRY</option>
                                                                                <option value="INDIA">INDIA</option>
                                                                                <option value="USA">USA</option>
                                                            </select>


                                        </div>
                    </form>

</body>

</footer>
</html>
