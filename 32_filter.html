<!DOCTYPE html>
<html lang="en">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>CSS filter</title>
                    <style>
                                        /* img{
                                                            filter:blur(10px);/*ise ham img ko blur kar sakte hai */
                                       /* } */
                                        .img1{
                                                            filter:brightness(120%) contrast(0.5);/*ise ham img ko brightness aur contrast dekhana hai */
                                                            width:312px;
                                        }
                                        .img2{
                                                            /* filter:grayscale(20%); */
                                                            filter:sepia(20%);/*ise ham img ko sepia dekhana hai */
                                                            width:312px;
                                        }
                                        .img3{
                                                            width:312px;
                                                            filter: opacity(1);/*ise ham img ko opacity dekhana hai */
                                        }




                    </style>
</head>
<body>
                    <div class="container">
                                        <img src="harry/virat.jpg" width="312px" alt="virat">
                                        <img class="img1" src="harry/mumbi.webp" alt="mumbai">
                                        <img class="img2" src="harry/sharma.jpg" alt="ue">
                                        <img class="img3" src="harry/dal.jpg.png" alt="ue">

                    </div>
</body>
</html>
