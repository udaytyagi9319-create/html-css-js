<!DOCTYPE html>
<html lang="en">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Nav-bar</title>
                    <style>
                                        *{
                                                            margin: 0;
                                                            padding: 0;
                                                            box-sizing: border-box;                  
                                        }
                                        .nav{
                                                            display:flex;
                                                            align-items: center;
                                                            background-color: aqua;
                                                            height: 13vh;
                                                            padding: 0px 20px;
                                                            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                                                            font-weight: 700;
                                                            align-content: center;
                                                            flex-flow: row wrap;
                                                            position: sticky;
                                                            top: 0;
                                                            justify-content: space-between;
                                        

                                                            





                                        }
                                        img{
                                                            margin-left:5px;
                                                            margin-right:15px;
                                                            border-radius: 12px;
                                                            background: whitesmoke;
                                        }
                                        .box-1{
                                                            display:flex;
                                                            flex-direction: column;
                                                            justify-content: left;

                                                           
                                        }
                                        .box-1 p{
                                                            font-size: 15px;
                                                            font-weight: 300;
                                                            text-align: end;
                                                            flex-flow: row wrap;
                                                            margin-right:auto;
                                        }
                                        ul{
                                                            display: flex;;
                                                            list-style:none;
                                                            gap:20px;
                                                            margin: 0px 20px;
                                                            font-weight: 500;
                                                            position:relative;
                                                            left:49%;
                                                            flex-flow: row wrap;

                                        }
                                        .content{
                                                            display: flex;
                                                            flex-direction: column;
                                                            justify-content: center;
                                                            align-items: center;
                                                            height: 80vh;
                                                            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                                        }
                                        .paragraph{
                                                            font-size: 20px;
                                                            font-weight: 400;
                                                            text-align: center;
                                                            width: 50%;
                                        }
                                        .Download{
                                                            padding: 10px 20px;
                                                            font-size: 18px;
                                                            font-weight: 500;
                                                            background-color: skyblue;
                                                            border: none;
                                                            border-radius: 5px;
                                                            margin: 20px;
                                                            
                                        }
                                        .text{
                                                            border:2px solid whitesmoke;
                                                            background-color: red;
                                                            text-align: center;
                                                            padding: 7px;
                                                            margin:5px;
                                        }
                                        .Download:hover{
                                                            background-color: deepskyblue;
                                                            cursor: pointer;
                                                            color:white
                                        
                                        }                                                
                                        

                    </style>
</head>
<body>
<nav>
                    <div class="nav">

                                        <img src="harry/new-ue.png" width="70" alt="ue logo">
                                        <div class="box-1">
                                                                  
                                                            <h1>UltraEdit</h1>
                                                            <p>by embarcadero</p>
                                        </div>
                                        
                                        <ul>
                                                            <li>Products</li>             
                                                            <li>Pricing</li>
                                                            <li>Resources</li>
                                                            <li>About us</li>
                                                            
                                        </ul>
                    </div>
                    
</nav>
<div class="content">
                    <h2>
                                        Download UltraEdit 
                    </h2>
                    <p class="text">⭐⭐⭐⭐⭐</p>
                                        
                    <p class="paragraph">the powerful text editor for Windows, Mac, and Linux. Experience unmatched performance and versatility for coding, editing, and more. Try it now!
                    </p>
                    <button class="Download">Download Now</button>
</div>

                    
</body>
</html>
