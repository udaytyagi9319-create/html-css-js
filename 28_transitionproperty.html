<!DOCTYPE html>
<html lang="en">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>CSS-Transition</title>
                    <style>
                                        .container{
                                                            background: red;
                                                            width: 50vh;
                                                            height:40vh;
                                        }
                                        .box{
                                                            background: aquamarine;
                                                            width: 5vh;
                                                            height:4vh;
                                                            /* transition-property:background-color, transform;
                                                            transition-duration:2s;/*ye kitne time tak chalega*/
                                                            /*transition-timing-function: cubic-bezier(.77,0,.18,1);/*ye transition ke speed ko control karta hai*/
                                                            /*transition:1s;ye kitne time ke baad chalega*/
                                                            transition: all 2s ease-in-out 1s;/*Ye sabhi property ke liye lag sakti hai*/
                                        } 
                                        .translate{
                                                            transform:translateX(10vw) translateY(10vh) scale(2);
                                                            background-color: blue;
                                        }
                    </style>
</head>
<body>
                    <div class="container">
                                        <div class="box translate" ></div>
                    </div>
</body>
</html>
