<!DOCTYPE html>
<html lang="en">

<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>CSS-flexbox</title>
                    <style>
                                        .container {
                                                            display: flex;
                                                            flex-direction: column;
                                                            justify-content: space-between;
                                                            align-items: center;
                                                            height: 40vh;
                                                            border:2px solid black;
                                                            flex-wrap:wrap;
                                                            flex-flow: row wrap;
                                                            align-content: center;
                                                            /* row-gap:2px; */
                                                            gap: 2px 10px;


                                        }
                                        .box-1{
                                                            border:2px solid rgb(6, 6, 6);
                                                            width: 100px;
                                                            height: 100px;
                                                            background-color: red;
                                                            flex-grow:2;
                                                            
                                        }
                                        .box-2{
                                                            border:2px solid rgb(6, 5, 5);
                                                            width: 100px;
                                                            height: 100px;
                                                            background-color: red;
                                                            flex-grow:2;
                                        }
                                        .box-3{
                                                            border:2px solid rgb(3, 3, 3);
                                                            width: 100px;
                                                            height: 100px;
                                                            background-color: red;
                                                            flex-grow:2;
                                        }
                                        .box-4{
                                                            border:2px solid rgb(5, 3, 3);
                                                            width: 100px;
                                                            height: 100px;
                                                            background-color: red;
                                                            flex-grow:2;
                                        }
                                        .box-5{
                                                            border:2px solid rgb(18, 16, 16);
                                                            width: 100px;
                                                            height: 100px;
                                                            background-color: red;
                                                            flex-grow:2;
                                        }
                                        
                                        
                    </style>
</head>

<body>
                    <div class="container">
                                        <div class="box-1">box-1</div>
                                        <div class="box-2">box-2</div>
                                        <div class="box-3">box-3</div>
                                        <div class="box-4">box-4</div>
                                        <div class="box-5">box-5</div>
                    </div>
</body>

</html>
