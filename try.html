<!DOCTYPE html>
<html lang="en">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>challenge</title>
                    <style>
                                        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Bpmf+Zihi+Kai+Std&display=swap');
                                        :root{
                                                            --textcolor:white;
                                                            --secolor: linear-gradient(to right,rgb(0, 170, 255),rgb(250, 0, 0));
                                                            --color:rgb(8, 154, 251);
                                        }


                                        *{
                                                            margin: 0;
                                                            padding:0
                                        }
                                        body{
                                                            background:var(--color);
                                                            
                                        }
                                        nav{
                                                            background:var(--secolor);
                                                            color:var(--textcolor);
                                                            padding:12px 0;
                                                            font-family: "Baloo Bhai 2", sans-serif;
                                                            font-weight: bolder;
                                                            position:sticky;
                                        }
                                        ul li{
                                                            list-style: none;
                                                            display: inline;/*ise ek line me aa jata hai without flex box*/
                                                            padding: 25px;
                                        }
                                        ul li a{
                                                   color:var(--textcolor);         
                                                   text-decoration: none;
                                        }
                                        
                    </style>
</head>
<body>
           <header>
                    <nav>
                                        <ul>
                                                            <li><a href="/">Home</li></a>
                                                            <li><a href="/">About</li></a>

                                        </ul>

                                        
                    </nav>
           </header>

</body>
</html>
